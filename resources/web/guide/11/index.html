<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="max-age=7200" />
<title tid="t47">Please select your login region</title>
<link rel="stylesheet" type="text/css" href="../../include/global.css" />	<!-- ORCA One for all-->
<link rel="stylesheet" type="text/css" href="../css/common.css" />		
<link rel="stylesheet" type="text/css" href="11.css" />
<link rel="stylesheet" type="text/css" href="../css/dark.css" />	
<script type="text/javascript" src="../js/jquery-3.6.0.min.js"></script>
<script type="text/javascript" src="../js/json2.js"></script>	
<script type="text/javascript" src="../../data/text.js"></script>	
<script type="text/javascript" src="../js/globalapi.js"></script>	
<script type="text/javascript" src="../../include/a11y.js"></script>
<script type="text/javascript" src="../js/common.js"></script>
<script type="text/javascript" src="11.js"></script>		
</head>
<body class="PlainButtons" onLoad="OnInit()">
<div id="Title">
	<h1 class="trans" tid="t47">Please select your login region</h1>
</div>
<main id="Content">
	<div id="EarthIcon"><img src="earth.png" alt=""/></div>
	<!-- ORCA one exclusive choice, not five independent toggles: as toggle buttons each
	     region announced on its own, nothing said the others were alternatives, and
	     choosing one never said the previous one had cleared. A radiogroup says
	     "North America, radio button, checked, 4 of 5" and carries the exclusivity for
	     free. The group is one Tab stop - the checked region holds the tabindex and the
	     arrow keys move the choice (11.js) - which is what a radio group promises. -->
	<div id="RegionList" role="radiogroup" aria-label="Login region" label-tid="a11y_login_region">
		<button type="button" class="trans RegionItem RegionSelected TextS1" tid="t48" region="Asia-Pacific" onclick="ChooseRegion('Asia-Pacific')" role="radio" aria-checked="true" tabindex="0">Asia-Pacific</button>
		<button type="button" class="trans RegionItem" tid="t49" region="China" onclick="ChooseRegion('China')" role="radio" aria-checked="false" tabindex="-1">China</button>
		<button type="button" class="trans RegionItem" tid="t60" region="Europe" onclick="ChooseRegion('Europe')" role="radio" aria-checked="false" tabindex="-1">Europe</button>
		<button type="button" class="trans RegionItem" tid="t61" region="North America" onclick="ChooseRegion('North America')" role="radio" aria-checked="false" tabindex="-1">North America</button>
		<button type="button" class="trans RegionItem" tid="t62" region="Others" onclick="ChooseRegion('Others')" role="radio" aria-checked="false" tabindex="-1">Others</button>
	</div>
<!--	<div id="ChangeTip">
		<div><img class="TipIcon" src="tip.png" /></div>
		<div tid="t63">After changing the region, your account will be logged out. Please log in again later.</div>
	</div>-->
</main>
<div id="AcceptArea">
	<button type="button" class="ButtonStyleConfirm ButtonTypeChoice trans" id="AcceptBtn" tid="t9"  onclick="GotoPolicyPage()">Next</button>
</div>	
</body>
</html>
