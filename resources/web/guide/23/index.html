<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="max-age=0" />
<title tid="t14">Filament Selection</title>
<link rel="stylesheet" type="text/css" href="../../include/global.css" />	<!-- ORCA One for all-->
<link rel="stylesheet" type="text/css" href="../css/common.css" />	
<link rel="stylesheet" type="text/css" href="../22/common.css" /> <!-- ORCA use common sources for setup guide and standalone dialog -->
<link rel="stylesheet" type="text/css" href="23.css" />
<link rel="stylesheet" type="text/css" href="../css/dark.css" />	
<script type="text/javascript" src="../js/jquery-3.6.0.min.js"></script>
<script type="text/javascript" src="../js/json2.js"></script>	
<script type="text/javascript" src="../../data/text.js"></script>	
<script type="text/javascript" src="../js/globalapi.js"></script>	
<script type="text/javascript" src="../../include/a11y.js"></script>
<script type="text/javascript" src="../js/common.js"></script>
<script type="text/javascript" src="../22/common.js"></script> <!-- ORCA use common sources for setup guide and standalone dialog -->
<script type="text/javascript" src="./23.js"></script>	
</head>
<body class="PlainButtons" onLoad="OnInit()">
<div id="Title">
	<h1 class="A11yOnly trans" tid="t14">Filament Selection</h1>
	<button type="button" id="SystemFilamentBtn" class="TitleSelected trans" tid="t109" onClick="OnSelectMenu(1)" aria-pressed="true">System Filaments</button>
	<button type="button" id="CustomFilamentBtn" class="TitleUnselected trans" tid="t110" onClick="OnSelectMenu(2)" aria-pressed="false">Custom Filaments</button>
</div>
<main id="Content" class="ZScrol">
	
<div id="SystemFilamentsArea">

<!-- ORCA column browser -->
<div class="cbr-browser-container">
	<div class="cbr-column">
		<!-- ORCA the column titles are the search fields' placeholders, so the page had no
		     heading below the h1 and h-key navigation could not skim it. These name each
		     column for that; A11yOnly (global.css) keeps them out of the layout. -->
		<h2 class="A11yOnly trans" tid="a11y_heading_printers">Printers</h2>
		<div class="cbr-column-title-container">
			<div class="search-icon"></div>
			<input type="text" class="cbr-search-bar FocusRingInset" placeholder=" " tabindex="0" aria-labelledby="MachineSearchLabel"/>
			<span class="cbr-search-placeholder trans" id="MachineSearchLabel" tid="t15" aria-hidden="true">printer</span>
			<div class="clear-icon" aria-hidden="true"></div>
		</div>
		<div class="cbr-content thin-scroll" id="MachineList">
			<div class="CValues">
				<!-- ORCA checked in the markup because SortUI only sets it once the profile
				     reply arrives, which is after a screen reader has read the page: the
				     first read reported the opposite of what the box was about to hold.
				     The other two columns' "all" boxes are checked there for the same reason. -->
				<label><input type="checkbox" mode="all" onClick="ChooseAllMachine()" checked /><span class="trans" tid="t11">all</span></label>
			</div>
			<div class="cbr-no-items">No items</div>
		</div>
	</div>

	<div class="cbr-column">
		<h2 class="A11yOnly trans" tid="a11y_heading_filament_types">Filament types</h2>
		<div class="cbr-column-title-container">
			<div class="search-icon"></div>
			<input type="text" class="cbr-search-bar FocusRingInset" placeholder=" " tabindex="0" aria-labelledby="FilatypeSearchLabel"/>
			<span class="cbr-search-placeholder trans" id="FilatypeSearchLabel" tid="t16" aria-hidden="true">filament type</span>
			<div class="clear-icon" aria-hidden="true"></div>
		</div>
		<div class="cbr-content thin-scroll" id="FilatypeList">
			<div class="CValues">
				<label><input type="checkbox" class="trans" tid="t11" onClick="ChooseAllFilament()" checked /><span class="trans" tid="t11">all</span></label>
			</div>
			<div class="cbr-no-items">No items</div>
		</div>
	</div>

	<div class="cbr-column">
		<h2 class="A11yOnly trans" tid="a11y_heading_vendors">Vendors</h2>
		<div class="cbr-column-title-container">
			<div class="search-icon"></div>
			<input type="text" class="cbr-search-bar FocusRingInset" placeholder=" " tabindex="0" aria-labelledby="VendorSearchLabel"/>
			<span class="cbr-search-placeholder trans" id="VendorSearchLabel" tid="t17" aria-hidden="true">vendor</span>
			<div class="clear-icon" aria-hidden="true"></div>
		</div>
		<div class="cbr-content thin-scroll" id="VendorList">
			<div class="CValues">
				<label><input type="checkbox" class="trans" tid="t11" onClick="ChooseAllVendor()" checked /><span class="trans" tid="t11">all</span></label>
			</div>
			<div class="cbr-no-items">No items</div>
		</div>
	</div>

	<div class="cbr-column">
		<h2 class="A11yOnly trans" tid="a11y_heading_filaments">Filaments</h2>
		<div class="cbr-column-title-container">
			<div class="cbr-filter-box">
				<div class="filter-icon"></div>
				<input type="text" class="cbr-filter-bar FocusRingInset" placeholder=" " tabindex="0" aria-labelledby="FilterLabel"/>
				<span class="cbr-filter-placeholder trans" id="FilterLabel" aria-hidden="true">Filter items</span>
				<div class="clear-icon" aria-hidden="true"></div>
			</div>
			<div class="ComboBox NoLabel">
				<div class="arrow-icon"></div>
				<select id="filter-tags" aria-label="Filter by state" label-tid="a11y_filter_by_state">
					<option value="0" disabled selected hidden></option>
					<option value="1">Checked</option>
					<option value="2">Unchecked</option>
				</select>
			</div>
			<!-- ORCA the counts on their own read as bare numbers - "13 slash 289 16". The
			     visible text is unchanged and the clipped twin beside it says what they count. -->
			<div class="list-item-count" aria-hidden="true"></div>
			<span class="A11yOnly" id="FilamentCountText"></span>
			<div class="cbr-filter-btns">
				<span class="cbr-filter-mode-filter  trans">Select filtered</span>
				<span class="cbr-filter-mode-visible trans">Select visible</span>
				<button type="button" class="ButtonStyleConfirm ButtonTypeWindow  trans" tid="t11" aria-label="Select all shown filaments" label-tid="a11y_select_all_shown" onClick="SelectAllFilament(1)">all</button>
				<button type="button" class="ButtonStyleRegular ButtonTypeWindow  trans" tid="t12" aria-label="Clear all shown filaments" label-tid="a11y_deselect_all_shown" onClick="SelectAllFilament(0)">Clear all</button>
			</div>	
		</div>
		<div class="cbr-content thin-scroll" id="ItemBlockArea">
			<!-- <label class="MItem"><input type="checkbox" class="trans" tid="t11" onClick="SelectAllFilament()" /><span class="trans" tid="t11">all</span></label> -->
			<div class="cbr-no-items">No items</div>
		</div>
	</div>
</div>

</div>
	
<div id="CustomFilamentsArea">
	<div id="CFilament_Btn_Area">
		<button type="button" class="ButtonStyleConfirm ButtonTypeWindow trans" tid="t111" onClick="OnClickCustomFilamentAdd()">Create New</button>
	</div>
    <div id="CFilament_List" class="thin-scroll">
	</div>
</div>
	
</main>
<div id="AcceptArea">
	<button type="button" class="ButtonStyleConfirm ButtonTypeChoice trans" tid="t39" id="AcceptBtn"  onclick="ConfirmSelect()">Confirm</button>
	<button type="button" class="ButtonStyleRegular ButtonTypeChoice trans" tid="t38" id="PreBtn"  onclick="CancelSelect()">Cancel</button>
</div>
<div id="NoticeMask">
</div>
	<div id="NoticeBody" role="dialog" aria-modal="true" aria-labelledby="NoticeText NoticeText2">
	<div id="NoticeBar" class="trans" tid="t18">error</div>
	<div id="NoticeContent">
	<div id="NoticeText" class="trans" tid="t19">At least one filament must be selected. </div>
	<div id="NoticeText2" class="trans" tid="t20">Do you want to use default filament ?</div>
	<div id="NoticeBtns">
		<button type="button" class="ButtonStyleConfirm ButtonTypeChoice trans" tid="t21" onClick="ChooseDefaultFilament()">yes</button>
		<button type="button" class="ButtonStyleRegular ButtonTypeChoice trans" tid="t22" onClick="ShowNotice(0)">no</button>
	</div>
	</div>
	</div>

</body>
<script>
	document.onkeydown = function (event) {
		var e = event || window.event || arguments.callee.caller.arguments[0];

		if (e.keyCode == 27) {
			if ($("#NoticeBody").is(":visible")) // the notice dialog is topmost, so it goes first
				ShowNotice(0);
			else
				ClosePage();
		}
	};
    window.addEventListener('wheel', function (event) {
        if (event.ctrlKey === true || event.metaKey) {
            event.preventDefault();
        }
    }, { passive: false });

	initInputEvents();
</script>
</html>
