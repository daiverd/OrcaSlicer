<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="max-age=7200" />
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" name="viewport" />	
<title tid="a11y_home_title">Home</title>
<link rel="stylesheet" type="text/css" href="../include/global.css" />	<!-- ORCA One for all-->
<link rel="stylesheet" type="text/css" href="./css/home.css" />
<link rel="stylesheet" type="text/css" href="./css/dark.css" />	

<script type="text/javascript" src="../include/jquery-2.1.1.min.js"></script>
<script type="text/javascript" src="../include/json2.js"></script>	
<script type="text/javascript" src="../include/globalapi.js"></script>	
<script type="text/javascript" src="../include/a11y.js"></script>

<link rel="stylesheet" type="text/css" href="../include/swiper/swiper-bundle.min.css" />
<script type="text/javascript" src="../include/swiper/swiper-bundle.min.js"></script>
<script type="text/javascript" src="../data/text.js"></script>		
	
<script type="text/javascript" src="js/home.js"></script>
</head>
<body class="ZScrol PlainButtons" onLoad="OnInit()">
<div id="LeftBoard">
	<div id="LoginArea">

		<!-- The panel has no visible title, so the heading is clipped: it is what
		     heading navigation lands on before the account rows. -->
		<h2 class="A11yOnly trans" tid="a11y_heading_accounts">Accounts</h2>

		<!-- Orca Cloud account -->
		<div id="OrcaAccount" class="AccountRow FocusRingInset" tabindex="0" role="button" aria-haspopup="true" aria-expanded="false"
			 onClick="OnAccountRowClick('orca')">
			<span class="AccountAvatar">
				<img id="UserAvatarIcon" class="AccountAvatarImg" alt="" onerror="OnAvatarLoadError(this)" />
			</span>
			<span class="AccountText">
				<span id="UserName" class="AccountName"></span>
				<span class="AccountSecondary">Orca Cloud</span>
			</span>
			<span class="AccountSignIn trans" tid="t26">Login</span>
			<svg class="AccountChevron" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
				<path d="M3 4.75L6 7.75L9 4.75" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
			</svg>
		</div>

		<!-- Bambu Cloud, a secondary provider folded away under the main account -->
		<div id="BambuCloudSection">
			<button type="button" id="BambuCloudHeader" class="FocusRingInset" aria-expanded="false" aria-controls="BambuCloudBody"
				 onClick="ToggleBambuSection()">
				<svg class="SectionChevron" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
					<path d="M4.5 2.5L8 6L4.5 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
				</svg>
				<span class="SectionLabel trans" tid="orca6">Bambu Cloud</span>
				<span id="BambuStatusDot"></span>
			</button>

			<div id="BambuCloudBody">
				<div id="BambuAccount" class="AccountRow AccountRowCompact FocusRingInset" tabindex="0" role="button" aria-haspopup="true" aria-expanded="false"
					 onClick="OnAccountRowClick('bambu')">
					<span class="AccountAvatar">
						<img id="BambuAvatarIcon" class="AccountAvatarImg" alt="" onerror="OnAvatarLoadError(this)" />
					</span>
					<span class="AccountText">
						<span id="BambuUserName" class="AccountName"></span>
						<span class="AccountSecondary trans" tid="orca8">Not signed in</span>
					</span>
					<span class="AccountSignIn trans" tid="t26">Login</span>
					<svg class="AccountChevron" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
						<path d="M3 4.75L6 7.75L9 4.75" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
					</svg>
				</div>

				<div id="NoPluginTip">
					<div id="NoPluginText"><a class="RedFont trans" tid="t76">Network plugin not detected. Click </a><button type="button" class="LinkBtn trans" onClick="BeginDownloadNetworkPlugin()" tid="t77">here</button><a class="RedFont trans" tid="t78"> to install it.</a></div>
				</div>
			</div>
		</div>

		<!-- Shared account menu, anchored under the row it was opened from.
		     The row already carries the avatar, name and provider, so the menu only
		     adds the account handle. -->
		<div id="AccountMenu" role="menu">
			<div id="AccountMenuHandle" role="presentation"></div>
			<div id="AccountMenuLogout" class="FocusRingInset" role="menuitem" tabindex="0" onClick="OnAccountMenuLogout()">
				<span id="AccountMenuLogoutIcon"></span>
				<span class="trans" tid="t50">Log out</span>
			</div>
		</div>

	</div>

	<div id="BtnArea">
	    <button type="button" menu="recent" class="BtnItem BtnItemSelected" aria-pressed="true" onClick="GotoMenu('recent')">
			<div class="BtnIcon "><img class="LeftIcon" src="img/i2.png" alt="" /></div>
			<div class="trans" tid="t28">recent</div>
		</button>
	    <div class="BtnItem BtnShortcut" tabindex="0" role="link" onClick="OpenUrlInLocalBrowser('https://cloud.orcaslicer.com')">
			<div class="BtnIcon "><img class="ShortcutBrandIcon" src="../image/logo.png" alt="" /></div>
			<div class="ShortcutTextRow">
				<div>OrcaCloud</div>
				<svg class="ShortcutMark" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
					<path d="M6 3.5H3.5C2.95 3.5 2.5 3.95 2.5 4.5V12.5C2.5 13.05 2.95 13.5 3.5 13.5H11.5C12.05 13.5 12.5 13.05 12.5 12.5V10" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
					<path d="M8.5 3.5H13.5V8.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
					<path d="M13.5 3.5L7 10" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
				</svg>
			</div>
		</div>

	</div>
</div>

<div id="RightBoard">
<main id="ContentBoard" class="ZScrol" board="recent">
	<h1 class="A11yOnly trans" tid="a11y_home_title">Home</h1>
    <div style="height: 14px;"></div>	
	<div id="MenuArea">
<!--		<div class="MenuItem" onClick="OnClickModelDepot()">
			<div class="MenuIcon"><img src="img/i6.png" alt="" /></div>
			<div>
				<div class="trans TextS1" tid="t90">3D Model</div>
				<div class="MenuDesc trans"  tid="t91">Download 3D Models</div>
			</div>
		</div>	-->	
		<!-- ORCA the description stays on screen but out of the accessibility tree: it is a
		     second block of text inside the button, which a screen reader rendered as a
		     second button line ("button New Project", then "button Create new project",
		     and a bare "button 3mf" under Open Project). Hidden, each card is one button
		     named by its title line. -->
		<button type="button" class="MenuItem" onClick="OnClickNewProject()">
			<div class="MenuIcon"><img src="img/i4.png" alt="" /></div>
			<div>
				<div class="trans TextS1" tid="t31">new project</div>
				<div class="MenuDesc trans" tid="t32" aria-hidden="true">create new project</div>
			</div>
		</button>
		<button type="button" class="MenuItem" onClick="OnClickOpenProject()">
			<div class="MenuIcon"><img src="img/i5.png" alt="" /></div>
			<div>
				<div class="trans TextS1" tid="t33">open project</div>
				<div class="MenuDesc" aria-hidden="true">3mf</div>
			</div>
		</button>
	</div>
	
	<div id="DebugText"></div>	
	<div id="RecentFileArea">
		<div id="RecentTitleBlock">
		    <h2 id="RecentTitle" class="Content-Title trans TextS1" tid="t35">recent open</h2>
			<button type="button" id="RecentClearAllBtn" class="ButtonStyleRegular ButtonTypeWindow trans" tid="t12" onClick="OnDeleteAllRecentFiles()">Clear all</button>
		</div>
		<ul id="FileList">
<!--	ORCA sample of one item as ShowRecentFileList() in js/home.js generates it:
		    <li class="FileItem" fpath="d:\model\11.3mf">
				<a class="FileTip" title="d:\model\11.3mf" aria-hidden="true"></a>
				<div class="FileImg"><img src="img/d.png" alt="" /></div>
				<button type="button" class="FileName TextS1 FocusRingInset" aria-describedby="RecentPath0 RecentDate0">abcd12334.3mf</button>
				<span class="A11yOnly" id="RecentPath0">d:\model\11.3mf</span>
				<div class="FileDate" id="RecentDate0">2021/12/27 09:22</div>
			</li>	-->
		</ul>
	</div>
	
    <div style="height: 14px;"></div>	
	
	<div id="recnet_context_menu" role="menu" aria-label="Recent file actions" label-tid="a11y_recent_file_menu">
		<div id="CT_Delete_Bar" class="CT_Item" tabindex="0" role="menuitem" onClick="OnDeleteRecentFile()">
			<div class="CT_Icon CT_Delete"></div>
			<div class="CT_Text trans" tid="t88">clear</div>
		</div>
		<div id="CT_Folder_Bar" class="CT_Item " tabindex="0" role="menuitem" onClick="OnExploreRecentFile()" >
			<div class="CT_Icon CT_Explore"></div>
			<div class="CT_Text trans" tid="t89">open in explorer </div>
		</div>
    </div>
	
	
</main>

</div>	
</body>
<script type="text/javascript">
	//HandleStudio(TestData);
    document.onkeydown = function (event) {
		var e = event || window.event || arguments.callee.caller.arguments[0];

		if (e.ctrlKey && e.metaKey)
			OutputKey(e.keyCode, true, false, true);
		else if (e.ctrlKey)
			OutputKey(e.keyCode, true, false, false);
		else if (e.metaKey)
			OutputKey(e.keyCode, false, false, true);

		if (e.shiftKey && e.ctrlKey)
			OutputKey(e.keyCode, true, true, false);

		if (e.shiftKey && e.metaKey)
			OutputKey(e.keyCode, false, true, true);
		// forward only the combos above; leave all other keys alone
	};

	window.addEventListener('mousewheel', function (event) {
		if (event.ctrlKey === true || event.metaKey) {
			event.preventDefault();
		}
	}, { passive: false });

</script>
</html>
